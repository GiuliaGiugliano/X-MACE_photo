[metadata]
name = mace-torch
version = attr: mace.__version__
short_description = MACE - Fast and accurate machine learning interatomic potentials with higher order equivariant message passing.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/ACEsuit/mace
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    License :: OSI Approved :: MIT License

[options]
packages = find:
python_requires = >=3.7
install_requires =
    # e3nn 0.4.4 calls torch.load() without weights_only=False, which PyTorch 2.6
    # made the default. Installing torch>=2.6 makes `import mace.calculators` fail.
    torch>=1.12,<2.6
    e3nn==0.4.4
    numpy
    opt_einsum
    opt_einsum_fx
    ase
    torch-ema
    prettytable
    matscipy
    configargparse
    h5py
    scipy
    torchmetrics
    tqdm
    schedulefree
    python-hostlist
    # for plotting:
    matplotlib
    pandas

[options.entry_points]
console_scripts =
    mace_active_learning_md  =  mace.cli.active_learning_md:main
    mace_create_lammps_model  =  mace.cli.create_lammps_model:main
    mace_eval_configs  =  mace.cli.eval_configs:main
    mace_plot_train  =  mace.cli.plot_train:main
    mace_run_train  =  mace.cli.run_train:main

[options.extras_require]
wandb = wandb
# Required by scripts/classification.py and scripts/xgboost_predict_new.py
# (oscillator-strength classification and virtual screening).
screening =
    xgboost>=2.0
    dscribe
    scikit-learn
    joblib
dev =
    pytest
    pytest-benchmark
